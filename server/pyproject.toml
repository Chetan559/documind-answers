[project]
name = "documind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.133.0",
    "google-genai>=1.66.0",
    "groq>=1.0.0",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "loguru>=0.7.3",
    "mistralai>=1.12.4",
    "opencv-python-headless>=4.13.0.92",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    # PaddleOCR — primary OCR engine (CPU mode, no GPU required).
    # NOTE: On Windows with NumPy 2.x, installation has compatibility issues:
    #   - paddleocr 2.x requires imgaug, which is broken on NumPy 2.x
    #   - paddleocr 3.x introduced torch/transformers dependency (heavy)
    # The code degrades gracefully: if PaddleOCR fails to import, the pipeline
    # automatically falls back to ocrmypdf for scanned/handwritten PDFs.
    # To install when compatible environment is available:
    #   pip install paddlepaddle -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
    #   pip install "paddleocr>=2.7.0"
    # "paddleocr>=2.7.0",
    # "paddlepaddle>=2.6.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "qdrant-client>=1.17.0",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
]
